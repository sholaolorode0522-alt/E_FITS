<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E_FITS - Bold.Intentional.Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--burgundy:#3a1414;--cream:#fdf8f3;--beige:#f5efe6;--muted:#9a8a7a;--line:#e8ddd0;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--burgundy);min-height:100vh}
.play{font-family:'Playfair Display',serif}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--burgundy)}
.auth-card{background:var(--cream);width:100%;max-width:420px;padding:36px 28px 28px;border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:22px}
.logo h1{font-size:48px;letter-spacing:8px;color:var(--burgundy);font-weight:700}
.logo p{letter-spacing:3px;font-size:12px;color:var(--muted);margin-top:6px;text-transform:uppercase}
.tabs{display:flex;background:var(--beige);margin-bottom:24px;border:1px solid var(--line)}
.tabs button{flex:1;padding:12px;font-size:13px;letter-spacing:2px;border:none;cursor:pointer;background:transparent;color:var(--burgundy);font-weight:500}
.tabs button.active{background:var(--burgundy);color:var(--cream)}
.field{position:relative;margin-bottom:14px}
.field input{width:100%;padding:14px 44px 14px 14px;border:1px solid var(--line);background:#fff;font-size:14px;outline:none}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--muted);width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.forgot{text-align:right;margin:-6px 0 16px}
.forgot a{font-size:12px;color:var(--burgundy);text-decoration:underline;cursor:pointer}
.btn{width:100%;padding:14px;background:var(--burgundy);color:var(--cream);border:none;letter-spacing:2px;font-size:13px;cursor:pointer;font-weight:600}
.shop{display:none;min-height:100vh;background:var(--cream)}
.shop.active{display:block}
.nav{position:sticky;top:0;z-index:10;background:var(--cream);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.nav h2{letter-spacing:6px;font-size:22px;color:var(--burgundy)}
.products{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover}
.card .info{padding:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal-box{background:var(--cream);max-width:360px;width:100%;padding:22px}
.chat-btn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--burgundy);color:var(--cream);border:none;font-size:22px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:90;display:flex;align-items:center;justify-content:center}
.chat-panel{position:fixed;bottom:90px;right:20px;width:340px;max-width:90vw;height:420px;background:#fff;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:91;display:none;flex-direction:column}
.chat-panel.open{display:flex}
.chat-head{background:var(--burgundy);color:var(--cream);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.chat-body{flex:1;padding:12px;overflow-y:auto;background:var(--beige);display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:8px 10px;font-size:12px;line-height:1.4;border-radius:8px}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.user{background:var(--burgundy);color:var(--cream);align-self:flex-end}
.chat-input{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fff}
.chat-input input{flex:1;padding:10px;border:1px solid var(--line);font-size:12px;outline:none}
.chat-input button{padding:10px 14px;background:var(--burgundy);color:#fff;border:none;cursor:pointer}
</style>
</head>
<body>
<div id="auth" class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><h1 class="play">E_FITS</h1><p>Bold.Intentional.Minimal</p></div>
    <div class="tabs">
      <button id="tLogin" class="active" onclick="switchTab('login')">LOGIN</button>
      <button id="tSignup" onclick="switchTab('signup')">SIGN UP</button>
    </div>
    <div class="field"><input id="email" type="email" placeholder="Email Address"></div>
    <div class="field">
      <input id="password" type="password" placeholder="Password">
      <span class="eye" onclick="toggleEye('password','eye1')"><i id="eye1" class="fa-regular fa-eye"></i></span>
    </div>
    <div id="signupExtra" style="display:none">
      <div class="field">
        <input id="confirm" type="password" placeholder="Confirm Password">
        <span class="eye" onclick="toggleEye('confirm','eye2')"><i id="eye2" class="fa-regular fa-eye"></i></span>
      </div>
    </div>
    <div class="forgot"><a onclick="openForgot()">Forgot password?</a></div>
    <button class="btn" onclick="enterBoutique()">ENTER BOUTIQUE</button>
  </div>
</div>

<div id="shop" class="shop">
  <div class="nav"><h2 class="play">E_FITS</h2></div>
  <div class="products">
    <div class="card"><img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"><div class="info"><h4>MINIMAL SET</h4><p>₦18,500</p></div></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400"><div class="info"><h4>BOLD DRESS</h4><p>₦22,000</p></div></div>
  </div>

  <!-- CLICKABLE LOGOS - HER REAL LINKS -->
  <div style="background:#fdf8f3;border-top:1px solid #e8ddd0;padding:26px 18px;text-align:center;margin-top:10px">
    <p style="letter-spacing:3px;font-size:11px;color:#9a8a7a;margin-bottom:14px">CONNECT WITH E_FITS</p>
    <div style="display:flex;justify-content:center;gap:16px">
      <a href="https://instagram.com/shop_e_fits" target="_blank" style="width:44px;height:44px;border-radius:50%;background:#3a1414;color:#fdf8f3;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://vm.tiktok.com/ZS9ycW9j823LR-wAEjt/" target="_blank" style="width:44px;height:44px;border-radius:50%;background:#3a1414;color:#fdf8f3;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none"><i class="fa-brands fa-tiktok"></i></a>
      <a href="mailto:shop.efits@gmail.com?subject=Hello%20E_FITS&body=Hi%20E_FITS%20team," style="width:44px;height:44px;border-radius:50%;background:#3a1414;color:#fdf8f3;display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none"><i class="fa-solid fa-envelope"></i></a>
      <a href="https://wa.me/2349066069350?text=Hi%20E_FITS%20I%20need%20help%20with%20my%20order" target="_blank" style="width:44px;height:44px;border-radius:50%;background:#3a1414;color:#fdf8f3;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none"><i class="fa-brands fa-whatsapp"></i></a>
    </div>
    <p style="font-size:10px;color:#9a8a7a;margin-top:14px">IG • TikTok • Gmail • WhatsApp - Tap to connect</p>
  </div>
</div>

<div id="forgotModal" class="modal" onclick="if(event.target==this)closeForgot()">
  <div class="modal-box">
    <h3 class="play">Reset Password</h3>
    <input id="forgotEmail" type="email" placeholder="Email Address" style="width:100%;padding:12px;border:1px solid #e8ddd0;margin:10px 0">
    <button class="btn" onclick="sendReset()">SEND RESET LINK</button>
    <p style="font-size:11px;text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline;color:#9a8a7a" onclick="closeForgot()">Back to login</p>
  </div>
</div>

<button class="chat-btn" onclick="toggleChat()"><i class="fa-regular fa-comment-dots"></i></button>
<div id="chatPanel" class="chat-panel">
  <div class="chat-head"><h4>E_FITS Support</h4><i class="fa-solid fa-xmark" style="cursor:pointer" onclick="toggleChat()"></i></div>
  <div id="chatBody" class="chat-body"><div class="msg bot">Hi! Welcome to E_FITS 💜 How can we help?</div></div>
  <div class="chat-input">
    <input id="chatInput" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<script>
let tab='login';
function switchTab(t){tab=t;document.getElementById('tLogin').classList.toggle('active',t==='login');document.getElementById('tSignup').classList.toggle('active',t==='signup');document.getElementById('signupExtra').style.display=t==='signup'?'block':'none';}
function toggleEye(id,iconId){let i=document.getElementById(id);let ic=document.getElementById(iconId);if(i.type==='password'){i.type='text';ic.className='fa-regular fa-eye-slash';}else{i.type='password';ic.className='fa-regular fa-eye';}}
function enterBoutique(){let e=document.getElementById('email').value.trim();let p=document.getElementById('password').value;if(!e||!p){alert('Put email and password');return}if(tab==='signup'){let c=document.getElementById('confirm').value;if(p!==c){alert('Passwords no match');return}}document.getElementById('auth').style.display='none';document.getElementById('shop').classList.add('active');}
function openForgot(){document.getElementById('forgotModal').classList.add('show')}
function closeForgot(){document.getElementById('forgotModal').classList.remove('show')}
function sendReset(){let e=document.getElementById('forgotEmail').value.trim();if(!e){alert('Put email');return}alert('Reset link sent to '+e);closeForgot()}
function toggleChat(){document.getElementById('chatPanel').classList.toggle('open')}
function sendMsg(){let input=document.getElementById('chatInput');let txt=input.value.trim();if(!txt)return;let body=document.getElementById('chatBody');let d=document.createElement('div');d.className='msg user';d.textContent=txt;body.appendChild(d);input.value='';body.scrollTop=body.scrollHeight;setTimeout(()=>{let r=document.createElement('div');r.className='msg bot';r.textContent='Thanks! We don receive am. Team go reply on WhatsApp/email soon.';body.appendChild(r);body.scrollTop=body.scrollHeight;},800);window.open('mailto:shop.efits@gmail.com?subject=New E_FITS Chat - '+encodeURIComponent(txt)+'&body=From: '+(localStorage.getItem('efits_user')||'guest')+'%0A%0A'+encodeURIComponent(txt));}
</script>
</body>
</html>
